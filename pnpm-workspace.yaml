packages:
  - apps/*
  - packages/*

overrides:
  react: 19.1.0
  react-dom: 19.1.0

peerDependencyRules:
  allowedVersions:
    '@apollo/server-plugin-landing-page-graphql-playground>@apollo/server': '^4.0.0 || ^5.0.0'

allowBuilds:
  '@apollo/protobufjs': false
  '@parcel/watcher': true
  '@swc/core': true
  bcrypt: true
  detox: false
  dtrace-provider: false
  less: false
  nx: true
  sharp: true
  unrs-resolver: false
