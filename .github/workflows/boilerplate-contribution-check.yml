name: boilerplate-contribution-check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect reusable foundation changes
        env:
          BOILERPLATE_CONTRIBUTION_BASE: origin/${{ github.base_ref }}
        run: pnpm boilerplate:contributions
      - name: Test synchronization automation
        run: pnpm test:sync-automation
      - name: Test categorized project learning
        run: |
          pnpm sync-skills
          pnpm test:skill-contribution
      - name: Test project identity initialization
        run: |
          pnpm test:project-init
          pnpm project:init --non-interactive --name "CI Product" --namespace com.example --domain ci.example.com --dry-run
      - name: Test Claude Design handoff
        run: pnpm test:design-handoff
