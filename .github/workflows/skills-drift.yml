name: skills-drift

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify generated instructions against the committed lock
        env:
          SKILLS_SOURCE_READ_TOKEN: ${{ secrets.SKILLS_SOURCE_READ_TOKEN }}
        run: npm run check-skills
