name: skills-source-update-available

on:
  repository_dispatch:
    types: [skills-source-updated]
  workflow_dispatch:
    inputs:
      sha:
        description: Full skills-source commit SHA to compare with the lock
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compare source revision with committed lock
        id: compare
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          MANUAL_SHA: ${{ inputs.sha }}
        run: |
          SOURCE_SHA="${DISPATCH_SHA:-$MANUAL_SHA}"
          LOCKED_SHA="$(node -p "require('./skills-source.lock.json').sha")"
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::The dispatched skills-source revision is not a full commit SHA."
            exit 1
          fi
          {
            echo "source_sha=$SOURCE_SHA"
            echo "locked_sha=$LOCKED_SHA"
            if [ "$SOURCE_SHA" = "$LOCKED_SHA" ]; then
              echo "up_to_date=true"
            else
              echo "up_to_date=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Close the tracking issue when the lock is current
        if: steps.compare.outputs.up_to_date == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKED_SHA: ${{ steps.compare.outputs.locked_sha }}
        run: |
          marker="skills-source-update-tracker"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"${marker}\" in:body" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "The lock is now at \`$LOCKED_SHA\`; no update is pending."
          fi
          echo "skills-source is already locked at $LOCKED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh the tracking issue
        if: steps.compare.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.compare.outputs.source_sha }}
          LOCKED_SHA: ${{ steps.compare.outputs.locked_sha }}
        run: |
          marker="skills-source-update-tracker"
          {
            printf '<!-- %s -->\n' "$marker"
            echo "A newer skills-source revision is available for review."
            echo
            echo "Locked: \`$LOCKED_SHA\`"
            echo "Available: \`$SOURCE_SHA\`"
            echo
            echo "Apply and review with:"
            echo '```bash'
            echo "npm run update-skills -- --sha $SOURCE_SHA"
            echo "npm run check-skills"
            echo '```'
            echo
            echo "Commit the updated \`skills-source.lock.json\` and regenerated"
            echo "\`AGENTS.md\` together; the \`skills-drift\` check gates the result."
          } > issue-body.md
          title="skills-source update available: ${SOURCE_SHA:0:8}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"${marker}\" in:body" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file issue-body.md
          fi
          echo "::warning::A newer skills-source revision is available: $SOURCE_SHA"
