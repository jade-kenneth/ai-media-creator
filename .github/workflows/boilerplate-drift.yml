name: boilerplate-drift

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report available app-boilerplate revisions
        run: pnpm boilerplate:check
      - name: Report foundation drift against reviewed revision
        run: pnpm boilerplate:foundation-drift
