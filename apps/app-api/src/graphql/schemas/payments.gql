enum PaymentStatus {
  PENDING
  REQUIRES_ACTION
  SUCCEEDED
  FAILED
  EXPIRED
}

enum PaymentChannel {
  GCASH
  PAYMAYA
}

type Payment implements Node {
  id: ID!
  """
  Reference the API generates and sends to the gateway. Callers never supply
  it, so a webhook can always be traced back to exactly one payment.
  """
  referenceId: String!
  status: PaymentStatus!
  channel: PaymentChannel!
  """
  Amount in the currency's smallest unit (for example centavos for PHP), so
  money never travels through a floating point value.
  """
  amount: Int!
  currency: String!
  description: String
  """
  Where to send the payer to authorize the payment. Present only while the
  gateway still expects the payer to act.
  """
  redirectUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreatePaymentInput {
  channel: PaymentChannel!
  amount: Int!
  description: String
}

extend type Query {
  payment(id: ID!): Payment!
  myPayments: [Payment!]!
}

extend type Mutation {
  createPayment(input: CreatePaymentInput!): Payment!
}
